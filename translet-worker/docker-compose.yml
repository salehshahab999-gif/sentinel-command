services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  translet-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      CELERY_BROKER: redis://redis:6379/0
      CELERY_RESULT: redis://redis:6379/0
      PDF_TRANSLATOR_SHARED_SECRET: ${PDF_TRANSLATOR_SHARED_SECRET:-sentinel-translet-local-dev-secret}
      TRANSLET_ENV: ${TRANSLET_ENV:-development}
      TRANSLET_DATA_DIR: /data
      TRANSLET_OCR_ENABLED: "1"
      TRANSLET_OCR_LANGUAGE: eng
      TRANSLET_OCR_DPI: "200"
      TRANSLET_OCR_ENABLED: "1"
      TRANSLET_OCR_LANGUAGE: eng
      TRANSLET_OCR_DPI: "200"
    command: ["python", "/app/server.py"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - translet-data:/data

  translet-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      CELERY_BROKER: redis://redis:6379/0
      CELERY_RESULT: redis://redis:6379/0
      PDF_TRANSLATOR_SHARED_SECRET: ${PDF_TRANSLATOR_SHARED_SECRET:-sentinel-translet-local-dev-secret}
      TRANSLET_ENV: ${TRANSLET_ENV:-development}
      TRANSLET_DATA_DIR: /data
    command:
      [
        "celery",
        "-A",
        "server.celery_app",
        "worker",
        "--concurrency=1",
        "--loglevel=INFO"
      ]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - translet-data:/data

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "11009:80"
    depends_on:
      - translet-api
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  translet-data:
