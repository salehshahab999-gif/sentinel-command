services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  translet-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      CELERY_BROKER: redis://redis:6379/0
      CELERY_RESULT: redis://redis:6379/0
      PDF_TRANSLATOR_SHARED_SECRET: ${PDF_TRANSLATOR_SHARED_SECRET:-sentinel-translet-local-dev-secret}
      TRANSLET_ENV: ${TRANSLET_ENV:-development}
      TRANSLET_DATA_DIR: /data
      TRANSLET_OCR_ENABLED: "1"
      TRANSLET_OCR_LANGUAGE: eng
      TRANSLET_OCR_DPI: "200"
      TRANSLET_TRANSLATION_WORKERS: "4"
      TRANSLET_TRANSLATION_PROVIDER: ${TRANSLET_TRANSLATION_PROVIDER:-local}
      TRANSLET_TRANSLATION_CHUNK_LIMIT: "3000"
      TRANSLET_LOCAL_MODEL_REPO: ${TRANSLET_LOCAL_MODEL_REPO:-mijuanlo/nllb-200-distilled-600M-ct2-int8}
      TRANSLET_LOCAL_MODEL_PATH: /data/models/nllb-200-distilled-600M-ct2-int8
      TRANSLET_LOCAL_MODEL_COMPUTE_TYPE: ${TRANSLET_LOCAL_MODEL_COMPUTE_TYPE:-int8}
      TRANSLET_LOCAL_MODEL_INTRA_THREADS: ${TRANSLET_LOCAL_MODEL_INTRA_THREADS:-4}
      TRANSLET_LOCAL_MODEL_BATCH_SIZE: ${TRANSLET_LOCAL_MODEL_BATCH_SIZE:-4}
      TRANSLET_ALLOW_CLOUD_FALLBACK: ${TRANSLET_ALLOW_CLOUD_FALLBACK:-0}
      TRANSLET_GENERATE_DUAL: "0"
      BAIDU_APP_ID: ${BAIDU_APP_ID:-}
      BAIDU_SECRET_KEY: ${BAIDU_SECRET_KEY:-}
    command: ["python", "/app/server.py"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - translet-data:/data

  translet-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      CELERY_BROKER: redis://redis:6379/0
      CELERY_RESULT: redis://redis:6379/0
      PDF_TRANSLATOR_SHARED_SECRET: ${PDF_TRANSLATOR_SHARED_SECRET:-sentinel-translet-local-dev-secret}
      TRANSLET_ENV: ${TRANSLET_ENV:-development}
      TRANSLET_DATA_DIR: /data
      TRANSLET_OCR_ENABLED: "1"
      TRANSLET_OCR_LANGUAGE: eng
      TRANSLET_OCR_DPI: "200"
      TRANSLET_TRANSLATION_PROVIDER: ${TRANSLET_TRANSLATION_PROVIDER:-local}
      TRANSLET_TRANSLATION_CHUNK_LIMIT: "3000"
      TRANSLET_GENERATE_DUAL: "0"
      BAIDU_APP_ID: ${BAIDU_APP_ID:-}
      BAIDU_SECRET_KEY: ${BAIDU_SECRET_KEY:-}
    command:
      [
        "celery",
        "-A",
        "server.celery_app",
        "worker",
        "--concurrency=1",
        "--loglevel=INFO"
      ]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - translet-data:/data

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "11009:80"
    depends_on:
      - translet-api
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  translet-data:
