name: Sentinel Translet CI

on:
  push:
    branches:
      - main
      - master
      - feat/translet-book-inputs
      - feat/translet-pdf-translator
      - feat/translet-universal-text-only
      - feat/pnt-multi-source-switch
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  next-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/sentinel?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate --schema=app/prisma/schema-local.prisma
      - run: npm run build

  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r translet-worker/requirements.txt
      - run: python3 -m compileall -q translet-worker
      - name: Syntax check worker files
        working-directory: translet-worker
        run: python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').rglob('*.py')]; print('syntax ok')"
      - name: Build worker image
        run: docker build -t sentinel-translet-test ./translet-worker
      - name: Calibre headless smoke test
        run: |
          docker run --rm sentinel-translet-test sh -lc "ebook-convert --version"