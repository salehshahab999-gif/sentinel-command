name: Sentinel Translet Universal Local CI

on:
  push:
    branches:
      - feat/translet-universal-text-only
  pull_request:
    branches:
      - feat/translet-scale-optimization-v2
      - feat/translet-universal-text-only
  workflow_dispatch:

jobs:
  worker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: python -m pip install -r translet-worker/requirements.txt

      - name: Compile worker
        run: python -m py_compile translet-worker/server.py translet-worker/local_engines.py translet-worker/test_server.py

      - name: Run worker smoke tests
        working-directory: translet-worker
        run: python test_server.py

  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f translet-worker/docker-compose.yml config

      - name: Build translation worker image
        run: docker build -t sentinel-translet-universal-test ./translet-worker

      - name: Inspect local engine dependencies
        run: docker run --rm sentinel-translet-universal-test python -c "import ctranslate2, langid, sentencepiece, fitz; import local_engines; print('local engine imports: ok')"
