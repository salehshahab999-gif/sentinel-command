# Deep catalog discovery revision 2.8: retrieve full public record pages for exact ISBN matches.
name: Grossman Archive Discovery

on:
  push:
    branches:
      - research/grossman-archive-fetch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/grossman-archive-fetch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deep archive and catalog discovery
        run: |
          python -m pip install --disable-pip-version-check requests
          python .github/scripts/grossman_deep_discovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: grossman-deep-discovery-results
          path: grossman-deep-results.json
          retention-days: 3
