name: Earth System Review - Documentation Check

on:
  push:
    branches:
      - master
      - "research/global-earth-system-*"
    paths:
      - "earth-system-global-review/**"
      - ".github/workflows/earth-system-review-check.yml"
  pull_request:
    paths:
      - "earth-system-global-review/**"
      - ".github/workflows/earth-system-review-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earth-system-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate reports and data tables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required files, CSV schemas, identifiers and links
        run: python earth-system-global-review/scripts/validate.py
