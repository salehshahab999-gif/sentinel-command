name: Earth System Review - Documentation and Dashboard Check

on:
  push:
    branches:
      - master
      - "feature/earth-system-*"
      - "research/global-earth-system-*"
    paths:
      - "Global-Earth-System-Complete-Report.md"
      - "EARTH-SYSTEM-ANNUAL-COMPARISON.md"
      - "earth-system-global-review/**"
      - ".github/workflows/earth-system-review-check.yml"
      - ".github/workflows/earth-system-dashboard.yml"
      - ".github/workflows/earth-system-annual-review.yml"
  pull_request:
    paths:
      - "Global-Earth-System-Complete-Report.md"
      - "EARTH-SYSTEM-ANNUAL-COMPARISON.md"
      - "earth-system-global-review/**"
      - ".github/workflows/earth-system-review-check.yml"
      - ".github/workflows/earth-system-dashboard.yml"
      - ".github/workflows/earth-system-annual-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earth-system-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate Earth System research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate visual dashboard and annual comparison
        run: python earth-system-global-review/scripts/build_dashboard.py
      - name: Validate reports, data, sources, links and SVG
        run: python earth-system-global-review/scripts/validate.py
      - name: Confirm generated outputs are reproducible
        run: python earth-system-global-review/scripts/build_dashboard.py --check
