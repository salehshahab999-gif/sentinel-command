name: Jabal Haylan F-15 DEM Reconciliation

on:
  push:
    branches: [master, main]
    paths:
      - "research/jabal-haylan-f15-dem-reconciliation.py"
      - "research/Jabal-Haylan-F15-Me1Ray-Reconciliation.md"
      - ".github/workflows/jabal-haylan-dem-reconciliation.yml"
  pull_request:
    paths:
      - "research/jabal-haylan-f15-dem-reconciliation.py"
      - "research/Jabal-Haylan-F15-Me1Ray-Reconciliation.md"
      - ".github/workflows/jabal-haylan-dem-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jabal-haylan-dem-reconciliation
  cancel-in-progress: true

jobs:
  sample-dem-profile:
    name: Sample and compare SRTM / ASTER elevation profiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query DEM sources and rank elevation-matched candidates
        run: python research/jabal-haylan-f15-dem-reconciliation.py
      - name: Upload reproducible profile and candidate summary
        uses: actions/upload-artifact@v4
        with:
          name: jabal-haylan-dem-profile
          path: research/output/
          if-no-files-found: error
          retention-days: 30
