name: Sentinel Translet Check

on:
  push:
    branches:
      - feat/translet-pdf-translator
      - test/translet-scale-100p
  pull_request:
    branches:
      - master
      - feat/pnt-multi-source-switch

jobs:
  next-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/sentinel?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate --schema=app/prisma/schema-local.prisma
      - run: npm run build

  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r translet-worker/requirements.txt
      - run: python -m py_compile translet-worker/server.py
      - working-directory: translet-worker
        run: python test_server.py

  scale-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r translet-worker/requirements.txt
      - working-directory: translet-worker
        env:
          TRANSLET_SCALE_PAGES: "100"
          TRANSLET_TRANSLATION_WORKERS: "1"
        run: python scale_smoke.py
