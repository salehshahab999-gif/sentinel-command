name: Sentinel Translet Check

on:
  push:
    branches:
      - feat/translet-pdf-translator
      - feat/translet-book-inputs
      - feat/translet-scale-optimization
      - feat/translet-universal-text-only
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - feat/pnt-multi-source-switch
      - feat/translet-book-inputs
      - feat/translet-scale-optimization-v2

jobs:
  next-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/sentinel?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate --schema=app/prisma/schema-local.prisma
      - run: npm run build

  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r translet-worker/requirements.txt
      - run: python -m py_compile translet-worker/server.py translet-worker/local_engines.py translet-worker/test_server.py
      - working-directory: translet-worker
        run: python test_server.py
      - name: Validate worker compose
        run: docker compose -f translet-worker/docker-compose.yml config
      - name: Build worker image
        run: docker build -t sentinel-translet-check ./translet-worker

  scale-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSLET_SCALE_PAGES: "7000"
      TRANSLET_TRANSLATION_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r translet-worker/requirements.txt
      - working-directory: translet-worker
        run: python scale_smoke.py
