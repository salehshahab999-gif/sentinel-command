name: Sentinel Translet Book Inputs

on:
  push:
    branches:
      - feat/translet-book-inputs
  pull_request:
    branches:
      - feat/translet-book-inputs
      - master

jobs:
  worker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: python -m pip install -r translet-worker/requirements.txt

      - name: Compile worker files
        run: python3 -m compileall -q translet-worker

      - name: Run worker smoke tests
        working-directory: translet-worker
        run: python test_server.py

      - name: Build worker image
        run: docker build -t sentinel-translet-test ./translet-worker

      - name: EPUB to PDF end-to-end test
        run: |
          docker run --rm -d --name tt-test sentinel-translet-test sleep 300
          docker cp translet-worker/../.github/epub-smoke.py tt-test:/tmp/epub-smoke.py 2>/dev/null || true
          docker exec tt-test python -c "import zipfile, os; print('epub check placeholder')"
          docker stop tt-test || true
