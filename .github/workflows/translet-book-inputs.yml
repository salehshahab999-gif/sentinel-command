name: Sentinel Translet Book Inputs

on:
  push:
    branches:
      - feat/translet-book-inputs
  pull_request:
    branches:
      - feat/translet-book-inputs
      - master
  workflow_dispatch:

jobs:
  worker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker requirements
        run: python -m pip install -r translet-worker/requirements.txt

      - name: Compile worker files
        run: python3 -m compileall -q translet-worker

      - name: Syntax check worker files
        working-directory: translet-worker
        run: python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').rglob('*.py')]; print('syntax ok')"

      - name: Build worker image
        run: docker build -t sentinel-translet-test ./translet-worker

      - name: Calibre headless smoke test
        run: |
          docker run --rm sentinel-translet-test sh -lc "ebook-convert --version"