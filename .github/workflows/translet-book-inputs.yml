name: Sentinel Translet Book Inputs

on:
  push:
    branches:
      - feat/translet-book-inputs
  pull_request:
    branches:
      - feat/translet-book-inputs
      - master
  workflow_dispatch:

jobs:
  worker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker requirements
        run: python -m pip install -r translet-worker/requirements.txt

      - name: Compile worker files
        run: python3 -m compileall -q translet-worker

      - name: Run worker smoke tests
        working-directory: translet-worker
        run: python test_server.py

      - name: Build worker image
        run: docker build -t sentinel-translet-test ./translet-worker

      - name: Calibre headless smoke test
        run: |
          docker run --rm sentinel-translet-test sh -lc "export QTWEBENGINE_CHROMIUM_FLAGS='--no-sandbox --disable-gpu --headless --disable-dev-shm-usage'; export QT_QPA_PLATFORM=offscreen; export LIBGL_ALWAYS_SOFTWARE=1; ebook-convert --version"
