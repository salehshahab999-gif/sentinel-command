name: Grossman Archive Fetch (manual, isolated)

on:
  push:
    branches:
      - research/grossman-archive-fetch
  workflow_dispatch:
    inputs:
      source_url:
        description: "Public archive URL (Yandex Disk or Internet Archive)"
        required: true
        type: string
        default: "https://yadi.sk/i/aoMayfFymfCSN"
      label:
        description: "Short source label"
        required: false
        type: string
        default: "znamya-1988-09"

permissions:
  contents: read

concurrency:
  group: grossman-archive-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public archive file safely
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_LABEL: ${{ inputs.label }}
        run: |
          python -m pip install --disable-pip-version-check requests
          python - <<'PY'
          import os, re, sys, json, hashlib
          from pathlib import Path
          from urllib.parse import urlparse
          import requests

          source = (os.environ.get("SOURCE_URL") or "https://yadi.sk/i/aoMayfFymfCSN").strip()
          label = re.sub(r"[^A-Za-z0-9._-]+", "-", os.environ.get("SOURCE_LABEL") or "znamya-1988-09")[:70] or "znamya-1988-09"
          u = urlparse(source)
          allowed = {"yadi.sk", "disk.yandex.ru", "archive.org", "www.archive.org", "imwerden.de", "www.imwerden.de"}
          if u.scheme != "https" or (u.hostname or "").lower() not in allowed:
              raise SystemExit("Blocked: only HTTPS Yandex Disk, Internet Archive, and ImWerden URLs are allowed.")

          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; GrossmanArchiveResearch/1.0)"})
          download_url = source

          if (u.hostname or "").lower() in {"yadi.sk", "disk.yandex.ru"}:
              api = "https://cloud-api.yandex.net/v1/disk/public/resources/download"
              r = s.get(api, params={"public_key": source}, timeout=30)
              print("Yandex public-link API:", r.status_code, r.headers.get("content-type"))
              r.raise_for_status()
              data = r.json()
              download_url = data.get("href")
              if not download_url:
                  raise SystemExit("Yandex did not return a public download URL: " + json.dumps(data)[:1000])

          # Stream to disk; reject unexpected redirect destinations and cap at 200 MiB.
          resp = s.get(download_url, stream=True, timeout=(20, 60), allow_redirects=True)
          resp.raise_for_status()
          final_host = (urlparse(resp.url).hostname or "").lower()
          redirect_allow = allowed | {"yandex.net", "storage.yandex.net", "downloader.disk.yandex.ru", "yadisk.net", "ia801xxx.us.archive.org"}
          if not (final_host in redirect_allow or final_host.endswith(".yandex.net") or final_host.endswith(".archive.org")):
              raise SystemExit("Blocked unexpected final host: " + final_host)

          outdir = Path("archive-output")
          outdir.mkdir(exist_ok=True)
          ctype = resp.headers.get("content-type","").lower()
          ext = ".bin"
          if "pdf" in ctype: ext = ".pdf"
          elif "djvu" in ctype: ext = ".djvu"
          elif "zip" in ctype: ext = ".zip"
          elif "html" in ctype: ext = ".html"
          elif "text" in ctype: ext = ".txt"

          path = outdir / (label + ext)
          total = 0
          h = hashlib.sha256()
          with path.open("wb") as f:
              for chunk in resp.iter_content(1024*1024):
                  if not chunk: continue
                  total += len(chunk)
                  if total > 200*1024*1024:
                      raise SystemExit("Stopped: file exceeds 200 MiB safety limit.")
                  h.update(chunk)
                  f.write(chunk)

          with path.open("rb") as f: magic = f.read(16)
          if magic.startswith(b"%PDF-"): detected = "PDF"
          elif magic[:4] in (b"AT&TF", b"FORM"): detected = "possible DjVu/FORM container"
          elif magic.startswith(b"PK\x03\x04"): detected = "ZIP"
          elif magic.startswith(b"<!DO") or b"<html" in magic.lower(): detected = "HTML page, not the document"
          else: detected = "unknown/binary; inspect before treating as a scan"

          report = {
            "requested_url": source,
            "final_url": resp.url,
            "final_host": final_host,
            "http_status": resp.status_code,
            "content_type": ctype,
            "bytes": total,
            "sha256": h.hexdigest(),
            "magic_detection": detected,
            "saved_file": str(path)
          }
          (outdir / "fetch-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if detected == "HTML page, not the document":
              print("NOTICE: the archive returned a web page, not a document file.")
          PY
      - name: Upload fetched file and diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: grossman-archive-${{ inputs.label }}
          path: archive-output/
          if-no-files-found: error
          retention-days: 3

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search public catalogs and probe alternate hosts
        run: |
          python -m pip install --disable-pip-version-check requests
          python - <<'PY'
          import requests, json
          from pathlib import Path
          s=requests.Session()
          s.headers["User-Agent"]="Mozilla/5.0 (compatible; GrossmanResearch/1.0)"
          results=[]
          queries=['title:"Знамя" AND year:1988','title:"Znamia" AND year:1988','"Дух свободы" AND Лазарев','"Жизнь и судьба" AND Гроссман AND Каunas']
          for q in queries:
            try:
              r=s.get("https://archive.org/advancedsearch.php",params={"q":q,"fl[]":["identifier","title","year","mediatype"],"rows":50,"page":1,"output":"json"},timeout=25)
              item={"kind":"archive.org-search","query":q,"status":r.status_code,"url":r.url}
              if r.ok:
                d=r.json(); item["numFound"]=d.get("response",{}).get("numFound"); item["docs"]=d.get("response",{}).get("docs",[])
              else: item["body"]=r.text[:300]
              results.append(item)
            except Exception as e: results.append({"kind":"archive.org-search","query":q,"error":str(e)})
          candidates=[
            ("oldjornal-index","https://oldjornal.ucoz.net/index/zhurnaly_quot_znamja_quot/0-6","index only"),
            ("yandex-issue9-old","https://yadi.sk/i/aoMayfFymfCSN","old link"),
            ("imwerden-grossman-1998","https://imwerden.de/pdf/grossman_sobranie_sochineny_v_4_tomakh_tom2_1998__ocr.pdf","alternate 1998 edition, not Kaunas"),
            ("imwerden-kuibyshev-1990","https://imwerden.de/pdf/grossman_zhizn_i_sudba_1990_text.pdf","Kuibyshev edition, not Kaunas"),
            ("djvu-online-znamya-1988-03","https://djvu.online/file/73PKnvJSlRCAE","issue 3, not issue 9"),
            ("archive-org-issue8","https://archive.org/details/B-001-028-257-1988-08-PDF","issue 8, not issue 9"),
            ("grossman-digital-center","https://dc.grossmanweb.eu/","digital archive landing page"),
            ("belousenko-index","https://www.belousenko.com/wr_Grossman_Vasily.htm","author bibliography")
          ]
          for label,url,note in candidates:
            try:
              r=s.get(url,timeout=25,allow_redirects=True,stream=True); chunk=next(r.iter_content(1024),b"")
              results.append({"kind":"candidate","label":label,"requested_url":url,"final_url":r.url,"status":r.status_code,"content_type":r.headers.get("content-type"),"content_length":r.headers.get("content-length"),"sample_bytes":len(chunk),"note":note})
              r.close()
            except Exception as e: results.append({"kind":"candidate","label":label,"requested_url":url,"error":str(e),"note":note})
          # Inspect the exact Internet Archive item metadata and available file names.
          try:
            item_id="B-001-028-257-1988-09-PDF"
            mr=s.get("https://archive.org/metadata/"+item_id,timeout=30)
            meta={"kind":"archive.org-item-metadata","identifier":item_id,"status":mr.status_code}
            if mr.ok:
              md=mr.json()
              meta["metadata"]=md.get("metadata",{})
              meta["files"]=[{"name":x.get("name"),"size":x.get("size"),"format":x.get("format"),"source":x.get("source"),"private":x.get("private")} for x in md.get("files",[])]
            else: meta["body"]=mr.text[:500]
            results.append(meta)

              # Fetch the public OCR derivative and verify Lazarev article heading.
              try:
                tx=s.get("https://archive.org/download/"+item_id+"/Znamia_1988_09_djvu.txt",timeout=40)
                check={"kind":"issue9-ocr-check","status":tx.status_code,"content_type":tx.headers.get("content-type"),"bytes":len(tx.content)}
                if tx.ok:
                  body=tx.content.decode("utf-8",errors="replace")
                  for term in ["Дух свободы","Лазарев","Л. Лазарев"]:
                    check[term]=body.lower().find(term.lower())
                  pos=body.lower().find("дух свободы")
                  if pos>=0: check["context"]=body[max(0,pos-800):pos+2200]
                else: check["body"]=tx.text[:500]
                results.append(check)
              except Exception as e: results.append({"kind":"issue9-ocr-check","error":str(e)})

          except Exception as e: results.append({"kind":"archive.org-item-metadata","error":str(e)})
          Path("discovery-results.json").write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: grossman-discovery-results
          path: discovery-results.json
          retention-days: 3
