name: Validate TeamSpeak Role Profiles

on:
  push:
    paths:
      - 'ops/teamspeak/**'
      - '.github/workflows/validate-teamspeak-roles.yml'
  pull_request:
    paths:
      - 'ops/teamspeak/**'
      - '.github/workflows/validate-teamspeak-roles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate explicit permission profiles
        run: node ops/teamspeak/validate-roles.cjs