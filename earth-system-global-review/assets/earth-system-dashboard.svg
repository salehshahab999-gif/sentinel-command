<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 900" width="1200" height="900">
<title id="title">Global Earth System visual dashboard</title>
<desc id="desc">A visual summary of global temperature, greenhouse gases, sea level, sea ice, glaciers, ocean heat, seafloor mapping and spatial-reference rules.</desc>
<rect width="1200" height="900" rx="28" fill="#0b1220"/>
<path d="M0 120 H1200" stroke="#29415e" stroke-width="2"/>
<text x="42" y="54" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">GLOBAL EARTH SYSTEM</text>
<text x="44" y="88" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="16">VISUAL RESEARCH DASHBOARD  •  SNAPSHOT: 02 NOV 2026</text>
<rect x="902" y="32" width="250" height="52" rx="15" fill="#172942" stroke="#29415e"/>
<text x="1027" y="64" text-anchor="middle" fill="#57d3e5" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">SOURCE-TRACEABLE • NOT LIVE</text>
<rect x="38" y="142" width="356" height="190" rx="20" fill="#121f33" stroke="#29415e" stroke-width="1.5"/>
<text x="58" y="176" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">🌡️  GLOBAL TEMPERATURE</text>
<text x="58" y="224" text-anchor="start" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">+1.43 °C</text>
<text x="58" y="250" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">1850–1900 reference</text>
<text x="58" y="274" text-anchor="start" fill="#f5c56b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">2024 → 2025: −0.12 °C</text>
<rect x="58" y="293" width="316" height="9" rx="4.5" fill="#263d57"/>
<rect x="58" y="293" width="225.9" height="9" rx="4.5" fill="#57d3e5"/>
<text x="58" y="320" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="400">DISPLAY SCALE 0–2 degC • NOT A RISK THRESHOLD</text>
<rect x="422" y="142" width="356" height="190" rx="20" fill="#121f33" stroke="#29415e" stroke-width="1.5"/>
<text x="442" y="176" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">🫧  ATMOSPHERIC CO₂</text>
<text x="442" y="224" text-anchor="start" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">426.8 ppm</text>
<text x="442" y="250" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">WMO annual mean</text>
<text x="442" y="274" text-anchor="start" fill="#70d6a5" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">2024 → 2025: +2.9 ppm</text>
<rect x="442" y="293" width="316" height="9" rx="4.5" fill="#263d57"/>
<rect x="442" y="293" width="257.7" height="9" rx="4.5" fill="#57d3e5"/>
<text x="442" y="320" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="400">DISPLAY SCALE 280–460 ppm • NOT A RISK THRESHOLD</text>
<rect x="806" y="142" width="356" height="190" rx="20" fill="#121f33" stroke="#29415e" stroke-width="1.5"/>
<text x="826" y="176" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">🌊  GLOBAL SEA LEVEL</text>
<text x="826" y="224" text-anchor="start" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">115.8 mm</text>
<text x="826" y="250" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">1993 reference</text>
<text x="826" y="274" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400">Source: NASA-SEA-LEVEL-2026</text>
<rect x="826" y="293" width="316" height="9" rx="4.5" fill="#263d57"/>
<rect x="826" y="293" width="244.0" height="9" rx="4.5" fill="#57d3e5"/>
<text x="826" y="320" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="400">DISPLAY SCALE 0–150 mm • NOT A RISK THRESHOLD</text>
<rect x="38" y="350" width="356" height="190" rx="20" fill="#121f33" stroke="#29415e" stroke-width="1.5"/>
<text x="58" y="384" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">🗺️  SEAFLOOR MAPPED</text>
<text x="58" y="432" text-anchor="start" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">28.7%</text>
<text x="58" y="458" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Modern-standard coverage</text>
<text x="58" y="482" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400">Source: GEBCO-2026</text>
<rect x="58" y="501" width="316" height="9" rx="4.5" fill="#263d57"/>
<rect x="58" y="501" width="90.7" height="9" rx="4.5" fill="#57d3e5"/>
<text x="58" y="528" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="400">DISPLAY SCALE 0–100 percent • NOT A RISK THRESHOLD</text>
<rect x="422" y="350" width="356" height="190" rx="20" fill="#121f33" stroke="#29415e" stroke-width="1.5"/>
<text x="442" y="384" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">❄️  ARCTIC SEA-ICE MINIMUM</text>
<text x="442" y="432" text-anchor="start" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">4.60 million km²</text>
<text x="442" y="458" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">NASA / NSIDC product</text>
<text x="442" y="482" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400">Source: NASA-NSIDC-ARCTIC-2026</text>
<text x="442" y="515" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400">Period: 2026-09-12</text>
<rect x="806" y="350" width="356" height="190" rx="20" fill="#121f33" stroke="#29415e" stroke-width="1.5"/>
<text x="826" y="384" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">🧊  ANTARCTIC SEA-ICE MAXIMUM</text>
<text x="826" y="432" text-anchor="start" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">17.59 million km²</text>
<text x="826" y="458" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">NASA / NSIDC product</text>
<text x="826" y="482" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400">Source: NASA-NSIDC-ANTARCTIC-2026</text>
<text x="826" y="515" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400">Period: 2026-09-14</text>
<rect x="38" y="558" width="356" height="190" rx="20" fill="#121f33" stroke="#29415e" stroke-width="1.5"/>
<text x="58" y="592" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">🏔️  MOUNTAIN GLACIER MASS</text>
<text x="58" y="640" text-anchor="start" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">−408 Gt</text>
<text x="58" y="666" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">2025 hydrological year</text>
<text x="58" y="690" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400">Source: WGMS-GLACIER-2025</text>
<text x="58" y="723" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400">Period: 2025 hydrological year</text>
<rect x="422" y="558" width="356" height="190" rx="20" fill="#121f33" stroke="#29415e" stroke-width="1.5"/>
<text x="442" y="592" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">🔥  OCEAN HEAT CHANGE</text>
<text x="442" y="640" text-anchor="start" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">+24 ± 6 ZJ</text>
<text x="442" y="666" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Full-depth • 2024–2025</text>
<text x="442" y="690" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400">Source: OHC-2025-REVIEW</text>
<text x="442" y="723" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400">Period: 2024-2025</text>
<rect x="806" y="558" width="356" height="190" rx="20" fill="#121f33" stroke="#29415e" stroke-width="1.5"/>
<text x="826" y="592" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">📍  GEO-SPATIAL READOUT</text>
<text x="826" y="640" text-anchor="start" fill="#57d3e5" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">LAT / LON / CRS / Z</text>
<text x="826" y="671" text-anchor="start" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Coordinates belong to a station, event or grid cell.</text>
<text x="826" y="697" text-anchor="start" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Global means are areas/grids, not one point.</text>
<text x="826" y="724" text-anchor="start" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400">Record datum, elevation/depth and uncertainty.</text>
<rect x="38" y="774" width="1124" height="88" rx="18" fill="#172942" stroke="#29415e"/>
<text x="60" y="806" fill="#57d3e5" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">ANNUAL COMPARISON ENGINE</text>
<text x="60" y="834" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="14">2024 → 2025 pairs: global temperature, CO₂, CH₄, N₂O and fossil CO₂.</text>
<text x="60" y="854" fill="#a8bbcf" font-family="Inter,Arial,sans-serif" font-size="11">Future values compare only when method, unit, baseline, geography and observation window match.</text>
</svg>
